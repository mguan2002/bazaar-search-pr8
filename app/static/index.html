<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bazaar Search — Tester</title>
<style>
  :root { --bg:#0f1115; --card:#1a1e26; --line:#2a2f3a; --fg:#e6e9ef; --mut:#9aa4b2; --acc:#4f8cff; }
  * { box-sizing: border-box; }
  body { margin:0; font:14px/1.4 system-ui, sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 18px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:baseline; }
  header h1 { font-size:16px; margin:0; }
  header .sub { color:var(--mut); font-size:12px; }
  .wrap { display:grid; grid-template-columns:280px 1fr; gap:0; height:calc(100vh - 51px); }
  .panel { padding:16px; border-right:1px solid var(--line); overflow:auto; }
  .panel label { display:block; margin:10px 0 4px; color:var(--mut); font-size:12px; }
  .panel input, .panel select { width:100%; padding:7px 8px; background:#0c0e12; color:var(--fg);
    border:1px solid var(--line); border-radius:6px; }
  .row2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .seg { display:flex; margin-bottom:8px; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
  .seg button { flex:1; padding:8px; background:#0c0e12; color:var(--fg); border:0; cursor:pointer; }
  .seg button.on { background:var(--acc); color:#fff; }
  .go { margin-top:14px; width:100%; padding:10px; background:var(--acc); color:#fff; border:0;
    border-radius:6px; font-weight:600; cursor:pointer; }
  .results { padding:16px; overflow:auto; }
  .bar { display:flex; align-items:center; gap:12px; margin-bottom:12px; color:var(--mut); }
  .bar button { padding:6px 10px; background:var(--card); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; cursor:pointer; }
  .bar button:disabled { opacity:.4; cursor:default; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .card img { width:100%; height:130px; object-fit:cover; background:#0c0e12; display:block; }
  .card .body { padding:8px 10px; }
  .card .t { font-weight:600; margin:0 0 4px; font-size:13px; }
  .card .p { color:var(--acc); font-weight:600; }
  .card .m { color:var(--mut); font-size:12px; margin-top:2px; }
  .err { background:#2a1416; border:1px solid #5a2a2a; color:#ffb4b4; padding:10px 12px;
    border-radius:6px; white-space:pre-wrap; font-family:ui-monospace,monospace; }
</style>
</head>
<body>
<header>
  <h1>Bazaar Search</h1>
  <span class="sub">tester UI · app_id=<code>demo-app</code> · P3 §3.2</span>
</header>
<div class="wrap">
  <form class="panel" id="form">
    <div class="seg" id="mode">
      <button type="button" data-mode="browse" class="on">Browse</button>
      <button type="button" data-mode="search">Search</button>
    </div>

    <div id="qwrap" style="display:none">
      <label>q (full-text)</label>
      <input id="q" placeholder="e.g. leather couch" />
    </div>

    <label>category</label>
    <select id="category">
      <option value="">(any)</option>
      <option>furniture</option><option>electronics</option><option>apparel</option>
      <option>baby_kids</option><option>other</option>
    </select>

    <label>condition</label>
    <select id="condition">
      <option value="">(any)</option>
      <option>new</option><option>like_new</option><option>good</option><option>fair</option>
    </select>

    <label>sort</label>
    <select id="sort"></select>

    <div class="row2">
      <div><label>price_min_cents</label><input id="price_min_cents" type="number" min="0" /></div>
      <div><label>price_max_cents</label><input id="price_max_cents" type="number" min="0" /></div>
    </div>

    <div class="row2">
      <div><label>latitude</label><input id="latitude" type="number" step="any" /></div>
      <div><label>longitude</label><input id="longitude" type="number" step="any" /></div>
    </div>
    <label>radius_km (default 25, max 100)</label>
    <input id="radius_km" type="number" step="any" placeholder="25" />

    <div class="row2">
      <div><label>limit (max 50)</label><input id="limit" type="number" value="20" min="1" max="50" /></div>
      <div><label>offset</label><input id="offset" type="number" value="0" min="0" /></div>
    </div>

    <button class="go" type="submit">Run</button>
    <p class="m" style="margin-top:10px">Presets:
      <a href="#" data-preset="mission">near Mission</a> ·
      <a href="#" data-preset="cheap-elec">cheap electronics</a></p>
  </form>

  <div class="results">
    <div class="bar">
      <span id="summary">—</span>
      <span style="flex:1"></span>
      <button id="prev" disabled>‹ Prev</button>
      <button id="next" disabled>Next ›</button>
    </div>
    <div id="out"></div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
let mode = "browse";

const SORTS = {
  browse: [["newest","newest"],["price_asc","price ↑"],["price_desc","price ↓"]],
  search: [["relevance","relevance"],["price_asc","price ↑"],["price_desc","price ↓"]],
};
function renderSorts() {
  $("sort").innerHTML = SORTS[mode].map(([v,l]) => `<option value="${v}">${l}</option>`).join("");
}
function setMode(m) {
  mode = m;
  document.querySelectorAll("#mode button").forEach(b => b.classList.toggle("on", b.dataset.mode === m));
  $("qwrap").style.display = m === "search" ? "block" : "none";
  renderSorts();
}
document.querySelectorAll("#mode button").forEach(b => b.onclick = () => setMode(b.dataset.mode));

function buildURL() {
  const base = mode === "search" ? "/v1/listings/search" : "/v1/listings";
  const p = new URLSearchParams();
  const put = (k) => { const v = $(k).value.trim(); if (v !== "") p.set(k, v); };
  if (mode === "search") put("q");
  ["category","condition","sort","price_min_cents","price_max_cents",
   "latitude","longitude","radius_km","limit","offset"].forEach(put);
  return `${base}?${p.toString()}`;
}

async function run() {
  const url = buildURL();
  const out = $("out");
  try {
    const res = await fetch(url, { headers: { "X-App-Id": "demo-app" } });
    const data = await res.json();
    if (!res.ok) {
      $("summary").textContent = `HTTP ${res.status}`;
      out.innerHTML = `<div class="err">HTTP ${res.status}\n${JSON.stringify(data, null, 2)}</div>`;
      $("prev").disabled = $("next").disabled = true;
      return;
    }
    const pg = data.pagination;
    $("summary").textContent = `${pg.total} results · showing ${data.data.length} · offset ${pg.offset} · ${url}`;
    $("prev").disabled = pg.offset <= 0;
    $("next").disabled = !pg.has_more;
    out.innerHTML = `<div class="grid">` + data.data.map(x => `
      <div class="card">
        <img src="${x.image_url || ''}" alt="" loading="lazy"
             onerror="this.style.visibility='hidden'"/>
        <div class="body">
          <p class="t">${esc(x.title)}</p>
          <div class="p">$${(x.price_cents/100).toFixed(2)}</div>
          <div class="m">${esc(x.category)} · ${esc(x.condition)}</div>
        </div>
      </div>`).join("") + `</div>`;
  } catch (e) {
    out.innerHTML = `<div class="err">Request failed: ${esc(String(e))}</div>`;
  }
}
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

$("form").onsubmit = (e) => { e.preventDefault(); $("offset").value = "0"; run(); };
$("prev").onclick = () => { step(-1); };
$("next").onclick = () => { step(1); };
function step(dir) {
  const limit = Math.max(1, parseInt($("limit").value || "20", 10));
  const offset = Math.max(0, parseInt($("offset").value || "0", 10) + dir * limit);
  $("offset").value = offset; run();
}

document.querySelectorAll("[data-preset]").forEach(a => a.onclick = (e) => {
  e.preventDefault();
  const clear = (ids) => ids.forEach(i => $(i).value = "");
  clear(["q","price_min_cents","price_max_cents","latitude","longitude","radius_km"]);
  if (a.dataset.preset === "mission") {
    setMode("browse"); $("category").value = "";
    $("latitude").value = "37.7599"; $("longitude").value = "-122.4148"; $("radius_km").value = "2";
  } else {
    setMode("browse"); $("category").value = "electronics"; renderSorts(); $("sort").value = "price_asc";
  }
  $("offset").value = "0"; run();
});

setMode("browse");
run();
</script>
</body>
</html>
